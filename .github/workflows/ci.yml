name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The tests are offline and never load the models, so torch is not installed here.
      - run: pip install pyarrow rapidfuzz pytest
      - run: python -m pytest -q
